<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — KMS Computer Club</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-indigo-950 to-gray-900 flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <!-- Logo / Brand -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl overflow-hidden shadow-2xl shadow-indigo-500/40 mb-4">
      <img src="assets/media/logo.png" alt="KMS Computer Club" class="w-full h-full object-cover">
    </div>
    <h1 class="text-2xl font-bold text-white tracking-tight">KMS Computer Club</h1>
    <p class="text-sm text-gray-400 mt-1">SMAN 1 Rancaekek</p>
  </div>

  <!-- Card -->
  <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">
    <h2 class="text-lg font-semibold text-white mb-1">Selamat datang kembali</h2>
    <p class="text-sm text-gray-400 mb-6">Masuk ke akun Anda untuk melanjutkan</p>

    <!-- Alert Box -->
    <div id="alertBox" class="mb-4"></div>

    <form action="proses_login.php" method="POST" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">Username</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="text" id="username" name="username" required autofocus
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="password" id="password" name="password" required
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
      </div>

      <button type="submit"
        class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm
               transition-all duration-200 shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 active:translate-y-0">
        Masuk ke Akun
      </button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      Belum punya akun?
      <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Daftar di sini</a>
    </p>
  </div>
</div>

<style>
  @keyframes toast-in  { from { opacity:0; transform:translateX(110%); } to { opacity:1; transform:translateX(0); } }
  @keyframes toast-out { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(110%); } }
  .toast-enter { animation: toast-in  .35s cubic-bezier(.22,1,.36,1) forwards; }
  .toast-leave { animation: toast-out .3s  cubic-bezier(.55,0,1,.45) forwards; }
</style>

<!-- Toast Container -->
<div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

<script>
  lucide.createIcons();
  const params = new URLSearchParams(window.location.search);
  const alertBox = document.getElementById('alertBox');

  /* ── Inline alerts (form errors) ── */
  const alerts = {
    invalid: ['bg-red-500/20 border-red-500/40 text-red-300', 'alert-circle', 'Username atau password salah.'],
    empty:   ['bg-amber-500/20 border-amber-500/40 text-amber-300', 'alert-triangle', 'Semua field wajib diisi.'],
  };
  if (params.get('registered') === '1')
    alertBox.innerHTML = `<div class="flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 mb-4"><svg xmlns='http://www.w3.org/2000/svg' class='w-4 h-4 shrink-0' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M5 13l4 4L19 7'/></svg>Registrasi berhasil! Silakan login.</div>`;
  else if (params.get('logout') === '1')
    alertBox.innerHTML = `<div class="flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium bg-blue-500/20 border border-blue-500/40 text-blue-300 mb-4"><svg xmlns='http://www.w3.org/2000/svg' class='w-4 h-4 shrink-0' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 16h-1v-4h-1m1-4h.01M12 18h.01'/></svg>Anda telah logout.</div>`;
  else {
    const err = params.get('error');
    if (alerts[err]) {
      const [cls, icon, msg] = alerts[err];
      alertBox.innerHTML = `<div class="flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium border ${cls} mb-4">${msg}</div>`;
    }
  }

  /* ── Toast helper ── */
  function showToast({ icon, title, message, colorClass, barClass, duration = 7000 }) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast-enter pointer-events-auto w-full bg-gray-900/95 backdrop-blur border ${colorClass} rounded-2xl shadow-2xl overflow-hidden`;
    toast.innerHTML = `
      <div class="flex items-start gap-3 p-4">
        <div class="shrink-0 mt-0.5">${icon}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-white">${title}</p>
          <p class="text-xs text-gray-300 mt-0.5 leading-relaxed">${message}</p>
        </div>
        <button onclick="dismissToast(this.closest('.toast-enter, div'))" class="shrink-0 text-gray-500 hover:text-gray-300 transition-colors ml-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="h-1 ${barClass} w-full origin-left" style="animation:shrink ${duration}ms linear forwards"></div>`;
    container.appendChild(toast);

    // progress bar shrink keyframe
    if (!document.getElementById('shrinkStyle')) {
      const s = document.createElement('style');
      s.id = 'shrinkStyle';
      s.textContent = `@keyframes shrink { from{transform:scaleX(1)} to{transform:scaleX(0)} }`;
      document.head.appendChild(s);
    }

    const timer = setTimeout(() => dismissToast(toast), duration);
    toast._timer = timer;
  }

  function dismissToast(el) {
    if (!el || el._dismissed) return;
    el._dismissed = true;
    clearTimeout(el._timer);
    el.classList.remove('toast-enter');
    el.classList.add('toast-leave');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }

  /* ── Status-based toasts ── */
  const err = params.get('error');

  if (err === 'pending') {
    showToast({
      icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
      title: 'Akun Menunggu Persetujuan',
      message: 'Pendaftaran kamu sedang ditinjau oleh admin. Harap bersabar, kami akan segera memprosesnya.',
      colorClass: 'border-amber-500/40',
      barClass: 'bg-amber-500',
    });
  } else if (err === 'rejected') {
    showToast({
      icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
      title: 'Pendaftaran Ditolak',
      message: 'Maaf, pendaftaran akun kamu telah ditolak oleh admin. Hubungi pengurus untuk informasi lebih lanjut.',
      colorClass: 'border-red-500/40',
      barClass: 'bg-red-500',
    });
  }
</script>
</body>
</html>
