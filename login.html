<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - KMS Computer Club</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
        max-width: 420px;
        width: 100%;
        margin: auto;
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .brand-title {
        font-weight: 700;
        color: #16213e;
    }
    .btn-primary {
        background-color: #0f3460;
        border: none;
    }
    .btn-primary:hover {
        background-color: #0a274a;
    }
</style>
</head>
<body>

<div class="card login-card p-4">
    <div class="card-body">
        <h4 class="text-center brand-title mb-1">KMS Computer Club</h4>
        <p class="text-center text-muted mb-4">Silakan login untuk melanjutkan</p>

        <!-- Area notifikasi (diisi otomatis via JavaScript dari parameter URL) -->
        <div id="alertBox"></div>

        <form action="proses_login.php" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <p class="text-center mt-3 mb-0">
            Belum punya akun? <a href="register.html">Daftar di sini</a>
        </p>
    </div>
</div>

<script>
    // Menampilkan pesan error / sukses berdasarkan parameter query string
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alertBox');

    if (params.get('error') === 'invalid') {
        alertBox.innerHTML = `<div class="alert alert-danger py-2">Username atau password salah.</div>`;
    } else if (params.get('error') === 'empty') {
        alertBox.innerHTML = `<div class="alert alert-warning py-2">Semua field wajib diisi.</div>`;
    } else if (params.get('registered') === '1') {
        alertBox.innerHTML = `<div class="alert alert-success py-2">Registrasi berhasil! Silakan login.</div>`;
    } else if (params.get('logout') === '1') {
        alertBox.innerHTML = `<div class="alert alert-info py-2">Anda telah logout.</div>`;
    }
</script>

</body>
</html>
