<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — KMS Computer Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-indigo-950 to-gray-900 flex items-center justify-center p-4 py-10">

<div class="w-full max-w-md">
  <!-- Brand -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 shadow-2xl shadow-indigo-500/40 mb-4">
      <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
    </div>
    <h1 class="text-2xl font-bold text-white tracking-tight">Daftar Anggota</h1>
    <p class="text-sm text-gray-400 mt-1">KMS Computer Club SMAN 1 Rancaekek</p>
  </div>

  <!-- Card -->
  <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">
    <div id="alertBox" class="mb-4"></div>

    <form action="proses_register.php" method="POST" id="registerForm" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label for="nama_lengkap" class="block text-sm font-medium text-gray-300 mb-1.5">Nama Lengkap <span class="text-red-400">*</span></label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="text" id="nama_lengkap" name="nama_lengkap" required autofocus
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
      </div>

      <div>
        <label for="kelas" class="block text-sm font-medium text-gray-300 mb-1.5">Kelas <span class="text-red-400">*</span></label>
        <div class="relative">
          <i data-lucide="school" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="text" id="kelas" name="kelas" placeholder="Contoh: XI MIPA 1" required
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
      </div>

      <div>
        <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">Username <span class="text-red-400">*</span></label>
        <div class="relative">
          <i data-lucide="at-sign" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="text" id="username" name="username" required
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Password <span class="text-red-400">*</span></label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="password" id="password" name="password" minlength="6" required
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
        <p class="text-xs text-gray-500 mt-1">Minimal 6 karakter</p>
      </div>

      <div>
        <label for="konfirmasi_password" class="block text-sm font-medium text-gray-300 mb-1.5">Konfirmasi Password <span class="text-red-400">*</span></label>
        <div class="relative">
          <i data-lucide="shield-check" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
          <input type="password" id="konfirmasi_password" name="konfirmasi_password" minlength="6" required
            class="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
        </div>
      </div>


      <!-- Kartu Pelajar Upload -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">
          Kartu Pelajar <span class="text-red-400">*</span>
          <span class="text-gray-500 font-normal">(JPG/PNG, maks. 2 MB)</span>
        </label>
        <div id="dropzone"
          class="relative border-2 border-dashed border-white/20 rounded-xl p-5 text-center cursor-pointer hover:border-indigo-400 hover:bg-white/5 transition-all">
          <input type="file" id="kartu_pelajar" name="kartu_pelajar" accept="image/jpeg,image/png" required
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          <i data-lucide="id-card" class="w-8 h-8 text-gray-500 mx-auto mb-2"></i>
          <p id="dropzoneLabel" class="text-sm text-gray-400">Klik atau seret foto kartu pelajar ke sini</p>
          <p class="text-xs text-gray-600 mt-1">Format: JPG, PNG</p>
        </div>
        <img id="previewImg" class="hidden mt-3 w-full max-h-40 object-contain rounded-xl border border-white/10" alt="Preview kartu pelajar">
      </div>

      <div>
        <label for="alasan_masuk" class="block text-sm font-medium text-gray-300 mb-1.5">Alasan Bergabung <span class="text-gray-500 font-normal">(opsional)</span></label>
        <textarea id="alasan_masuk" name="alasan_masuk" rows="2"
          placeholder="Ceritakan alasan kamu ingin bergabung…"
          class="w-full px-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"></textarea>
      </div>

      <button type="submit"
        class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm
               transition-all duration-200 shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 active:translate-y-0">
        Daftar Sekarang
      </button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      Sudah punya akun?
      <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Login di sini</a>
    </p>

    <div class="mt-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 flex gap-2">
      <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
      <p class="text-xs text-amber-300">Akun akan menunggu persetujuan Admin sebelum bisa digunakan. Pastikan foto kartu pelajar jelas dan terbaca.</p>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  // Error alerts from redirect
  const params = new URLSearchParams(window.location.search);
  const alertBox = document.getElementById('alertBox');
  const alerts = {
    empty:              ['bg-amber-500/20 border-amber-500/40 text-amber-300', 'Semua field wajib diisi.'],
    password_mismatch:  ['bg-red-500/20 border-red-500/40 text-red-300', 'Password dan konfirmasi tidak sama.'],
    username_exists:    ['bg-red-500/20 border-red-500/40 text-red-300', 'Username sudah digunakan.'],
    password_short:     ['bg-amber-500/20 border-amber-500/40 text-amber-300', 'Password minimal 6 karakter.'],
    no_id_card:         ['bg-red-500/20 border-red-500/40 text-red-300', 'Foto kartu pelajar wajib diunggah.'],
    upload_error:       ['bg-red-500/20 border-red-500/40 text-red-300', 'Gagal mengunggah kartu pelajar.'],
  };
  const err = params.get('error');
  if (alerts[err]) {
    const [cls, msg] = alerts[err];
    alertBox.innerHTML = `<div class="flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium border ${cls}">${msg}</div>`;
  }

  // Password match validation
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    const pass    = document.getElementById('password').value;
    const confirm = document.getElementById('konfirmasi_password').value;
    if (pass !== confirm) {
      e.preventDefault();
      alertBox.innerHTML = `<div class="flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium border bg-red-500/20 border-red-500/40 text-red-300">Password dan konfirmasi tidak sama.</div>`;
      window.scrollTo(0, 0);
    }
  });

  // File preview
  document.getElementById('kartu_pelajar').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    document.getElementById('dropzoneLabel').textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('previewImg');
      img.src = e.target.result;
      img.classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
