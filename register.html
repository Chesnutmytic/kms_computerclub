<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daftar Akun - KMS Computer Club</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                background: linear-gradient(135deg, #1a1a2e, #16213e);
                font-family: "Segoe UI", sans-serif;
                padding: 20px 0;
            }
            .register-card {
                max-width: 480px;
                width: 100%;
                margin: auto;
                border: none;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
            .brand-title {
                font-weight: 700;
                color: #16213e;
            }
            .btn-primary {
                background-color: #0f3460;
                border: none;
            }
            .btn-primary:hover {
                background-color: #0a274a;
            }
        </style>
    </head>
    <body>
        <div class="card register-card p-4">
            <div class="card-body">
                <h4 class="text-center brand-title mb-1">Daftar Akun Baru</h4>
                <p class="text-center text-muted mb-4">KMS Computer Club</p>

                <div id="alertBox"></div>

                <form action="proses_register.php" method="POST">
                    <div class="mb-3">
                        <label for="nama_lengkap" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama_lengkap" name="nama_lengkap" required autofocus />
                    </div>

                    <div class="mb-3">
                        <label for="kelas" class="form-label">Kelas</label>
                        <input type="text" class="form-control" id="kelas" name="kelas" placeholder="Contoh: XI MIPA 1" required />
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="6" required />
                        <div class="form-text">Minimal 6 karakter.</div>
                    </div>

                    <div class="mb-3">
                        <label for="konfirmasi_password" class="form-label">Konfirmasi Password</label>
                        <input type="password" class="form-control" id="konfirmasi_password" name="konfirmasi_password" minlength="6" required />
                    </div>

                    <div class="mb-3">
                        <label for="alasan_masuk" class="form-label">Alasan Bergabung</label>
                        <textarea class="form-control" id="alasan_masuk" name="alasan_masuk" rows="3" placeholder="Ceritakan alasan kamu ingin bergabung dengan Computer Club..."></textarea>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Daftar</button>
                    </div>
                </form>

                <p class="text-center mt-3 mb-0">Sudah punya akun? <a href="login.html">Login di sini</a></p>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById("alertBox");

            if (params.get("error") === "empty") {
                alertBox.innerHTML = `<div class="alert alert-warning py-2">Semua field wajib (kecuali alasan) harus diisi.</div>`;
            } else if (params.get("error") === "password_mismatch") {
                alertBox.innerHTML = `<div class="alert alert-danger py-2">Password dan konfirmasi password tidak sama.</div>`;
            } else if (params.get("error") === "username_exists") {
                alertBox.innerHTML = `<div class="alert alert-danger py-2">Username sudah digunakan, silakan pilih username lain.</div>`;
            } else if (params.get("error") === "password_short") {
                alertBox.innerHTML = `<div class="alert alert-warning py-2">Password minimal 6 karakter.</div>`;
            }

            // Validasi konfirmasi password di sisi client sebelum submit
            document.querySelector("form").addEventListener("submit", function (e) {
                const pass = document.getElementById("password").value;
                const confirm = document.getElementById("konfirmasi_password").value;
                if (pass !== confirm) {
                    e.preventDefault();
                    alertBox.innerHTML = `<div class="alert alert-danger py-2">Password dan konfirmasi password tidak sama.</div>`;
                }
            });
        </script>
    </body>
</html>
